# Configuración de Netlify: publica la carpeta docs/ que genera build.mjs.
[build]
  command = "node build.mjs"
  publish = "docs"

[build.environment]
  NODE_VERSION = "20"

# Fuentes, imágenes, CSS y JS pueden guardarse en caché del navegador.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
